services:
  base:
    build:
      context: .
      dockerfile: Dockerfile.base
    image: gt-base:latest
    command: ["echo", "base image ready"]

  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: gt-db
      POSTGRES_USER: app_user
      POSTGRES_PASSWORD: ${DB_PASSWORD:-strongpass}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app_user -d gt-db"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - gt_network
      - default

  pgbouncer:
    image: edoburu/pgbouncer:latest
    environment:
      DATABASE_URL: postgres://app_user:${DB_PASSWORD:-strongpass}@postgres:5432/gt-db
      AUTH_TYPE: scram-sha-256
      POOL_MODE: transaction
      MAX_CLIENT_CONN: 200
      DEFAULT_POOL_SIZE: 25
    ports:
      - "6432:5432"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - gt_network
      - default

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - gt_network
      - default

  minio:
    image: minio/minio:latest
    container_name: gt_minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: ${MINIO_PASSWORD:-minioadmin}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - miniodata:/data
    networks:
      - gt_network

  clamav:
    image: clamav/clamav:latest
    ports:
      - "3310:3310"

  hocuspocus-stub:
    image: alpine:latest
    command: sh -c "echo 'Hocuspocus stub running' && tail -f /dev/null"

  tei:
    build:
      context: ./backend/tei
      args:
        USE_GPU: ${USE_GPU:-false}
    develop:
      watch:
        - action: sync
          path: ./backend/tei/server.py
          target: /app/server.py
        - action: rebuild
          path: ./backend/tei/requirements.txt
        - action: rebuild
          path: ./backend/tei/Dockerfile
    environment:
      - HF_HOME=/app/.cache
      - MODEL_ID=thomasht86/voyage-4-nano-ONNX
    ports:
      - "8080:8080"
    volumes:
      - tei_cache:/app/.cache
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 15s
      timeout: 10s
      retries: 5
    networks:
      - gt_network
      - default

  fastapi:
    build: ./backend
    develop:
      watch:
        - action: sync
          path: ./backend/app
          target: /app/app
          ignore:
            - "**/__pycache__/"
            - "**/*.pyc"
            - "**/.venv/"
            - "**/uploads/"
            - "**/*.log"
        - action: sync
          path: ./backend/migrations
          target: /app/migrations
          ignore:
            - "**/__pycache__/"
            - "**/*.pyc"
        - action: rebuild
          path: ./backend/requirements.txt
        - action: rebuild
          path: ./backend/Dockerfile
    environment:
      DATABASE_URL: postgresql://app_user:${DB_PASSWORD:-strongpass}@postgres:5432/gt-db
      REDIS_URL: redis://redis:6379
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: ${MINIO_PASSWORD:-minioadmin}
      TEI_URL: http://tei:8080
      ENVIRONMENT: dev
      JWT_SECRET_KEY: ${JWT_SECRET:-dev-jwt-secret-gt-local}
      CELERY_HMAC_SECRET: ${HMAC_SECRET:-dev-celery-hmac-gt-local}
      TOGETHER_API_KEY: ${TOGETHER_API_KEY:-}
      SPACY_DATA_PATH: /app/nlp_models/spacy
      STANZA_RESOURCES_DIR: /app/nlp_models/stanza
    depends_on:
      pgbouncer:
        condition: service_started
      redis:
        condition: service_started
      minio:
        condition: service_started
      tei:
        condition: service_healthy
    ports:
      - "8000:8000"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - runtime_config:/app/config
      - nlp_models:/app/nlp_models
    networks:
      - gt_network

  worker-fast:
    build: ./workers/fast
    networks:
      - gt_network
      - default
    develop:
      watch:
        - action: sync+restart
          path: ./workers/fast/tasks.py
          target: /app/tasks.py
        - action: rebuild
          path: ./workers/fast/requirements.txt
        - action: rebuild
          path: ./workers/fast/Dockerfile
    environment:
      DATABASE_URL: postgresql://app_user:${DB_PASSWORD:-strongpass}@postgres:5432/gt-db
      REDIS_URL: redis://redis:6379
      TEI_URL: http://tei:8080
      CELERY_HMAC_SECRET: ${HMAC_SECRET:-dev-celery-hmac-gt-local}
      TOGETHER_API_KEY: ${TOGETHER_API_KEY:-}
      PYTHONPATH: /app/backend:/app/backend/app
    volumes:
      - ./backend:/app/backend:ro
      - ./backend/app/prompts:/app/prompts:ro
      - runtime_config:/app/config:ro
    depends_on:
      - pgbouncer
      - redis
      - tei

  worker-nlp:
    build: ./workers/nlp
    networks:
      - gt_network
      - default
    develop:
      watch:
        - action: sync+restart
          path: ./workers/nlp/tasks.py
          target: /app/tasks.py
        - action: sync+restart
          path: ./workers/nlp/segmentador.py
          target: /app/segmentador.py
        - action: sync+restart
          path: ./workers/nlp/embedding_client.py
          target: /app/embedding_client.py
        - action: rebuild
          path: ./workers/nlp/requirements.txt
        - action: rebuild
          path: ./workers/nlp/Dockerfile
    volumes:
      - uploads_data:/app/uploads
      - ./backend:/app/backend:ro
      - runtime_config:/app/config:ro
      - nlp_models:/app/nlp_models
    command: celery -A tasks worker --queues=nlp --concurrency=1 --loglevel=info
    environment:
      DATABASE_URL: postgresql://app_user:${DB_PASSWORD:-strongpass}@postgres:5432/gt-db
      REDIS_URL: redis://redis:6379/0
      TEI_URL: http://tei:8080
      CELERY_HMAC_SECRET: ${HMAC_SECRET:-dev-celery-hmac-gt-local}
      UPLOAD_DIR: /app/uploads
      PYTHONPATH: /app/backend:/app/backend/app
      SPACY_DATA_PATH: /app/nlp_models/spacy
      STANZA_RESOURCES_DIR: /app/nlp_models/stanza
    mem_limit: ${NLP_MEM_LIMIT:-6g}
    # Stanza coref necesita ~2GB, spaCy lg ~600MB → minimo 4GB, recomendado 6GB
    depends_on:
      pgbouncer:
        condition: service_started
      tei:
        condition: service_healthy
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker-heavy:
    build: ./workers/heavy
    networks:
      - gt_network
      - default
    develop:
      watch:
        - action: sync+restart
          path: ./workers/heavy/tasks.py
          target: /app/tasks.py
        - action: sync+restart
          path: ./workers/heavy/agents_b.py
          target: /app/agents_b.py
        - action: sync+restart
          path: ./workers/heavy/llm_client.py
          target: /app/llm_client.py
        - action: sync+restart
          path: ./workers/heavy/database.py
          target: /app/database.py
        - action: rebuild
          path: ./workers/heavy/requirements.txt
        - action: rebuild
          path: ./workers/heavy/Dockerfile
    environment:
      DATABASE_URL: postgresql://app_user:${DB_PASSWORD:-strongpass}@postgres:5432/gt-db
      CELERY_HMAC_SECRET: ${HMAC_SECRET:-dev-celery-hmac-gt-local}
      TOGETHER_API_KEY: ${TOGETHER_API_KEY:-}
      PYTHONPATH: /app/backend:/app/backend/app
    depends_on:
      - pgbouncer
    volumes:
      - ./backend:/app/backend:ro
      - ./backend/app/prompts:/app/prompts:ro
      - runtime_config:/app/config:ro
    # No hard mem_limit — API-bound, negligible memory

  frontend:
    image: node:22-alpine
    working_dir: /app
    volumes:
      - ./frontend:/app
      - frontend_modules:/app/node_modules
    ports:
      - "3000:3000"
    networks:
      - gt_network
      - default
    command: sh -c "npm install && npm run dev"

volumes:
  pgdata:
  redisdata:
  miniodata:
  frontend_modules:
  runtime_config:
  uploads_data:
  tei_cache:
    driver: local
    driver_opts:
      type: none
      device: "/mnt/hdd/Program Files/Docker/gt/cache"
      o: bind
  nlp_models:

networks:
  gt_network:
    driver: bridge
