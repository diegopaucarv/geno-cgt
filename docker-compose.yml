version: "3.8"

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: gt-db
      POSTGRES_USER: app_user
      POSTGRES_PASSWORD: ${DB_PASSWORD:-strongpass}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app_user -d myapp"]
      interval: 5s

  pgbouncer:
    image: edoburu/pgbouncer:latest
    environment:
      DATABASE_URL: postgres://app_user:${DB_PASSWORD:-strongpass}@postgres:5432/myapp
      POOL_MODE: transaction
      MAX_CLIENT_CONN: 200
      DEFAULT_POOL_SIZE: 25
    ports:
      - "6432:6432"
    depends_on:
      postgres:
        condition: service_healthy

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: ${MINIO_PASSWORD:-minioadmin}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - miniodata:/data

  clamav:
    image: clamav/clamav:latest
    ports:
      - "3310:3310"

  hocuspocus-stub:
    # Stub simple para desarrollo
    image: alpine:latest
    command: sh -c "echo 'Hocuspocus stub running' && tail -f /dev/null"

  tei:
    image: ghcr.io/huggingface/text-embeddings-inference:86-1.4
    command: --model-id BAAI/bge-small-en-v1.5 --revision main
    ports:
      - "8080:8080"
    volumes:
      - tei_cache:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 10s

  fastapi:
    build: ./backend
    environment:
      DATABASE_URL: postgresql://app_user:${DB_PASSWORD:-strongpass}@pgbouncer:6432/myapp
      REDIS_URL: redis://redis:6379
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: ${MINIO_PASSWORD:-minioadmin}
      TEI_URL: http://tei:8080
      ENVIRONMENT: dev
      JWT_SECRET_KEY: ${JWT_SECRET:-changeme}
      CELERY_HMAC_SECRET: ${HMAC_SECRET:-changeme}
    depends_on:
      pgbouncer:
        condition: service_started
      redis:
        condition: service_started
      minio:
        condition: service_started
      tei:
        condition: service_healthy
    ports:
      - "8000:8000"

  worker-fast:
    build: ./workers/fast
    environment:
      DATABASE_URL: postgresql://app_user:${DB_PASSWORD:-strongpass}@pgbouncer:6432/myapp
      REDIS_URL: redis://redis:6379
      TEI_URL: http://tei:8080
      CELERY_HMAC_SECRET: ${HMAC_SECRET:-changeme}
    depends_on:
      - pgbouncer
      - redis
      - tei

  worker-nlp:
    build: ./workers/nlp
    environment:
      DATABASE_URL: postgresql://app_user:${DB_PASSWORD:-strongpass}@pgbouncer:6432/myapp
      TEI_URL: http://tei:8080
      CELERY_HMAC_SECRET: ${HMAC_SECRET:-changeme}
    depends_on:
      - pgbouncer
      - tei

  worker-heavy:
    build: ./workers/heavy
    environment:
      DATABASE_URL: postgresql://app_user:${DB_PASSWORD:-strongpass}@pgbouncer:6432/myapp
      CELERY_HMAC_SECRET: ${HMAC_SECRET:-changeme}
    depends_on:
      - pgbouncer

volumes:
  pgdata:
  redisdata:
  miniodata:
  tei_cache:
