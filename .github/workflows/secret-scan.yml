name: Secret Scan

# ═══════════════════════════════════════════════════════════════════════
# Escanea cada push en busca de secrets hardcodeados.
# Si detecta una API key, password o token → FALLA el build.
# ═══════════════════════════════════════════════════════════════════════

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main, develop]

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect secrets with Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # ── Patrones adicionales específicos de GT ────────────────────
      - name: Custom pattern scan
        run: |
          echo "🔍 Buscando patrones sospechosos..."
          RED=$(git --no-pager grep -nE \
            '(tgp_v1_|sk-[a-zA-Z0-9]{20,}|eyJ[A-Za-z0-9_-]{20,}\.[A-Za-z0-9_-]{20,})' \
            -- ':!.github/**' ':!.env.example' || true)

          if [ -n "$RED" ]; then
            echo "❌ SECRETOS DETECTADOS:"
            echo "$RED"
            echo ""
            echo "⚠️  Nunca commitees API keys, JWT secrets, o tokens."
            echo "   Usa GitHub Secrets → Settings > Secrets > Actions"
            exit 1
          fi
          echo "✅ Sin secretos detectados"
